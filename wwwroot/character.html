<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Персонаж</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <div class="topbar">
            <a href="index.html">← На главную</a>
            <button id="panel-toggle" type="button">Показать</button>
        </div>

        <div id="content"></div>

        <div class="actions">
            <button id="create" type="button">Создать</button>
            <button id="update" type="button">Обновить текущего персонажа</button>
            <button id="save-as-new" type="button">Сохранить как нового</button>
            <button id="delete" type="button">Удалить</button>
        </div>

        <div id="toast" class="toast hidden"></div>
    </main>

    <div id="modal" class="modal hidden">
        <div class="modal-box">
            <p id="modal-text"></p>
            <div id="modal-buttons" class="modal-buttons"></div>
        </div>
    </div>
    <div id="panel-backdrop" class="backdrop hidden"></div>

    <aside id="show-panel" class="panel hidden">
        <div class="panel-head">
            <h2>Что показывать</h2>
        </div>
        <div class="panel-body">
            <div id="panel-root"></div>
            <div id="panel-other"></div>
        </div>
        <div class="panel-actions">
            <button id="panel-apply" type="button">Применить</button>
            <button id="panel-cancel" type="button">Отмена</button>
        </div>
    </aside>
    <script src="lz-string.min.js"></script>
    <script src="shared.js"></script>
    <script src="character.js"></script>
</body>

</html>
