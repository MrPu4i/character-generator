<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Новый персонаж — что показать</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="page page-select">
    <div class="character-nav">
        <a href="index.html">← На главную</a>
    </div>

    <main>
        <header class="select-header">
            <p class="sheet-kicker">Создание героя</p>

            <p class="hint">Выберите основные черты и то, что показывать</p>

        <div class="select-layout">
            <section class="select-col">
                <h2>Основные черты</h2>
                <div id="root-choices"></div>
            </section>
            <section class="select-col">
                <h2>Что показать</h2>
                <div id="other-blocks"></div>
            </section>
        </div>

        <button id="generate" type="button">Сгенерировать</button>
    </main>
    <script src="lz-string.min.js"></script>
    <script src="shared.js"></script>
    <script src="select.js"></script>
