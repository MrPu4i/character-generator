<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Генерация персонажей</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <h1>Генерация персонажей</h1>
        <button id="create" type="button">Создать персонажа</button>
    </main>
    <script>
        document.getElementById('create').addEventListener('click', () => {
            sessionStorage.removeItem('character');
            sessionStorage.setItem('mode', 'new');
            location.href = 'select.html';
        });
    </script>
</body>

</html>
